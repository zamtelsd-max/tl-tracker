<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary -->
    <title>TL Tracker – Zamtel</title>
    <meta name="description" content="Zamtel Mobile Money Team Lead Productivity Tracker" />
    <meta name="theme-color" content="#00843D" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/tl-tracker/manifest.json" />

    <!-- Favicon -->

    <!-- iOS (Apple) PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="msapplication-TileColor" content="#00843D" />
